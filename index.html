<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Toko Kopi Rejeki — Katalog Biji Kopi, Kopi Bubuk, Minuman Siap Saji, dan Paket Bundling UMKM Lokal."
    />
    <title>Toko Kopi Rejeki — Katalog &amp; Dashboard UMKM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

      rel="stylesheet"
    />
    <style>
      :root {
        --bg-cream: #faf6f0;
        --bg-surface: #ffffff;
        --bg-warm-tint: #f3ebe0;
        --text-espresso: #2c1a12;
        --text-muted: #6b5344;
        --accent-caramel: #c87d32;
        --accent-caramel-dark: #a66220;
        --wa-green: #1f8e4d;
        --wa-green-dark: #17703c;
        --danger: #c0392b;
        --border-sand: #e5d8c8;
        --radius-md: 12px;
        --radius-lg: 18px;
        --shadow-sm: 0 2px 8px rgba(44, 26, 18, 0.06);
        --shadow-md: 0 8px 24px rgba(44, 26, 18, 0.09);
        --font-heading: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
        --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background-color: var(--bg-cream);
        color: var(--text-espresso);
        font-family: var(--font-body);
        line-height: 1.6;
        overflow-x: hidden;
      }

      h1,
      h2,
      h3,
      .brand-title {
        font-family: var(--font-heading);
        margin: 0;
        line-height: 1.2;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }

      .container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 16px;
      }

      .navbar {
        position: sticky;
        top: 0;
        z-index: 40;
        background: rgba(250, 246, 240, 0.94);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border-sand);
      }

      .navbar-inner {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-top: 12px;
        padding-bottom: 12px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: var(--text-espresso);
      }

      .brand-icon {
        font-size: 1.75rem;
        background: var(--bg-warm-tint);
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border-sand);
      }

      .brand-title {
        display: block;
        font-size: 1.15rem;
        font-weight: 800;
      }

      .brand-sub {
        display: block;
        font-size: 0.78rem;
        color: var(--text-muted);
      }

      .nav-tabs {
        display: flex;
        gap: 8px;
      }

      .nav-btn {
        border: 1px solid var(--border-sand);
        background: var(--bg-surface);
        color: var(--text-espresso);
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 0.88rem;
        padding: 8px 14px;
        border-radius: 999px;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .nav-btn:hover {
        border-color: var(--accent-caramel);
      }

      .nav-btn.active {
        background: var(--text-espresso);
        color: #fff;
        border-color: var(--text-espresso);
      }

      .toast {
        position: fixed;
        bottom: 20px;
        right: 16px;
        left: 16px;
        max-width: 460px;
        margin-left: auto;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px;
        border-radius: var(--radius-md);
        background: var(--text-espresso);
        color: #fff;
        box-shadow: var(--shadow-md);
        font-size: 0.9rem;
      }

      .toast-warning {
        background: #8a5314;
      }

      .toast-error {
        background: var(--danger);
      }

      .toast-close {
        background: transparent;
        border: none;
        color: #fff;
        font-size: 1.25rem;
        cursor: pointer;
        line-height: 1;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 0.92rem;
        padding: 10px 18px;
        border-radius: 10px;
        border: 1px solid transparent;
        text-decoration: none;
        cursor: pointer;
        transition: background-color 0.15s ease, transform 0.1s ease;
      }

      .btn:active {
        transform: translateY(1px);
      }

      .btn-primary {
        background: var(--accent-caramel);
        color: #fff;
      }

      .btn-primary:hover {
        background: var(--accent-caramel-dark);
      }

      .btn-outline {
        background: var(--bg-surface);
        color: var(--text-espresso);
        border-color: var(--border-sand);
      }

      .btn-outline:hover {
        border-color: var(--accent-caramel);
        background: var(--bg-warm-tint);
      }

      .btn-danger-outline {
        background: var(--bg-surface);
        color: var(--danger);
        border-color: #ebc8c4;
      }

      .btn-danger-outline:hover {
        background: #fdf2f1;
      }

      .btn-wa {
        width: 100%;
        background: var(--wa-green);
        color: #fff;
        font-weight: 700;
      }

      .btn-wa:hover {
        background: var(--wa-green-dark);
      }

      .btn-disabled {
        background: #d8cfc4;
        color: #6b5e51;
        cursor: not-allowed;
      }

      .hero {
        padding: 36px 0 28px;
        border-bottom: 1px solid var(--border-sand);
        background: linear-gradient(180deg, #f5ede1 0%, var(--bg-cream) 100%);
      }

      .hero-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
        align-items: center;
      }

      .hero-badge {
        display: inline-block;
        background: var(--bg-surface);
        border: 1px solid var(--border-sand);
        color: var(--accent-caramel-dark);
        font-weight: 700;
        font-size: 0.8rem;
        padding: 6px 12px;
        border-radius: 999px;
        margin-bottom: 12px;
      }

      .hero h1 {
        font-size: 1.95rem;
        font-weight: 800;
        margin-bottom: 12px;
      }

      .hero-desc {
        color: var(--text-muted);
        margin: 0 0 20px;
        max-width: 58ch;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .hero-card-art {
        background: var(--bg-surface);
        border: 1px solid var(--border-sand);
        border-radius: var(--radius-lg);
        padding: 24px;
        text-align: center;
        box-shadow: var(--shadow-sm);
      }

      .art-emoji-main {
        font-size: 4rem;
        margin-bottom: 12px;
      }

      .art-pills {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
      }

      .art-pills span {
        background: var(--bg-warm-tint);
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 0.82rem;
        font-weight: 600;
      }

      .catalog-section,
      .dashboard-section {
        padding: 32px 0 48px;
      }

      .section-header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: flex-end;
        gap: 12px;
        margin-bottom: 18px;
      }

      .section-header h2 {
        font-size: 1.5rem;
        font-weight: 800;
      }

      .section-sub {
        margin: 4px 0 0;
        color: var(--text-muted);
        font-size: 0.9rem;
      }

      .controls-bar {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        margin-bottom: 14px;
      }

      .search-box input,
      .sort-box select,
      .form-group input,
      .form-group select,
      .form-group textarea {
        width: 100%;
        padding: 11px 14px;
        border-radius: 10px;
        border: 1px solid var(--border-sand);
        background: var(--bg-surface);
        color: var(--text-espresso);
        font-family: var(--font-body);
        font-size: 0.94rem;
      }

      .search-box input:focus,
      .sort-box select:focus,
      .form-group input:focus,
      .form-group select:focus,
      .form-group textarea:focus {
        outline: 2px solid var(--accent-caramel);
        border-color: var(--accent-caramel);
      }

      .category-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 22px;
      }

      .pill-btn {
        border: 1px solid var(--border-sand);
        background: var(--bg-surface);
        color: var(--text-espresso);
        font-family: var(--font-body);
        font-size: 0.86rem;
        font-weight: 600;
        padding: 7px 14px;
        border-radius: 999px;
        cursor: pointer;
      }

      .pill-btn.active {
        background: var(--accent-caramel);
        border-color: var(--accent-caramel);
        color: #fff;
      }

      .product-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .product-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-sand);
        border-radius: var(--radius-lg);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: var(--shadow-sm);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .product-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }

      .product-card.is-out {
        opacity: 0.85;
      }

      .card-media {
        position: relative;
        background: var(--bg-warm-tint);
        padding: 24px 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-bottom: 1px solid var(--border-sand);
      }

      .card-emoji {
        font-size: 3.1rem;
      }

      .card-badges {
        position: absolute;
        top: 10px;
        left: 10px;
        right: 10px;
        display: flex;
        justify-content: space-between;
        gap: 6px;
        pointer-events: none;
      }

      .badge-category,
      .badge-featured {
        font-size: 0.75rem;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 999px;
      }

      .badge-category {
        background: var(--bg-surface);
        color: var(--text-espresso);
        border: 1px solid var(--border-sand);
      }

      .badge-featured {
        background: #fef3c7;
        color: #92400e;
        border: 1px solid #f59e0b;
      }

      .card-body {
        padding: 16px;
        display: flex;
        flex-direction: column;
        flex: 1;
      }

      .card-title {
        font-size: 1.08rem;
        font-weight: 700;
        margin-bottom: 6px;
      }

      .card-desc {
        font-size: 0.88rem;
        color: var(--text-muted);
        margin: 0 0 14px;
        flex: 1;
      }

      .card-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 12px;
      }

      .card-price {
        font-family: var(--font-heading);
        font-size: 1.15rem;
        font-weight: 800;
        color: var(--text-espresso);
      }

      .stock-badge {
        font-size: 0.78rem;
        font-weight: 700;
        padding: 3px 9px;
        border-radius: 6px;
      }

      .stock-ok {
        background: #e6f4ea;
        color: #137333;
      }

      .stock-low {
        background: #fef7e0;
        color: #b06000;
      }

      .stock-out {
        background: #fce8e6;
        color: #c5221f;
      }

      .empty-state {
        text-align: center;
        background: var(--bg-surface);
        border: 1px dashed var(--border-sand);
        border-radius: var(--radius-lg);
        padding: 40px 20px;
      }

      .empty-emoji {
        font-size: 2.75rem;
        margin-bottom: 10px;
      }

      .empty-state p {
        color: var(--text-muted);
        max-width: 44ch;
        margin: 8px auto 18px;
      }

      .demo-banner {
        background: #fef7e0;
        border: 1px solid #f5d67b;
        color: #5c3d08;
        padding: 12px 16px;
        border-radius: var(--radius-md);
        font-size: 0.88rem;
        margin-bottom: 20px;
      }

      .dashboard-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
        margin-bottom: 22px;
      }

      .stat-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-sand);
        border-radius: var(--radius-md);
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
      }

      .stat-label {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-muted);
      }

      .stat-value {
        font-family: var(--font-heading);
        font-size: 1.85rem;
        font-weight: 800;
        margin: 4px 0;
      }

      .stat-hint {
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      .form-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-sand);
        border-radius: var(--radius-lg);
        padding: 20px;
        margin-bottom: 22px;
        box-shadow: var(--shadow-sm);
      }

      .form-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }

      .btn-close-form {
        background: transparent;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        color: var(--text-muted);
      }

      .form-errors {
        background: #fce8e6;
        border: 1px solid #f4b8b3;
        color: #8c1d18;
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 0.88rem;
        margin-bottom: 14px;
      }

      .form-errors ul {
        margin: 6px 0 0;
        padding-left: 18px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
        margin-bottom: 14px;
      }

      .form-group label {
        display: block;
        font-size: 0.86rem;
        font-weight: 600;
        margin-bottom: 6px;
      }

      .form-checkbox-wrap {
        display: flex;
        align-items: flex-end;
      }

      .checkbox-label {
        display: inline-flex !important;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        padding: 10px 0;
      }

      .checkbox-label input {
        width: auto;
      }

      .form-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }

      .table-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-sand);
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: var(--shadow-sm);
      }

      .table-responsive {
        width: 100%;
        overflow-x: auto;
      }

      .product-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }

      .product-table th,
      .product-table td {
        padding: 12px 14px;
        text-align: left;
        border-bottom: 1px solid var(--border-sand);
      }

      .product-table th {
        background: var(--bg-warm-tint);
        font-weight: 700;
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .table-prod {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        min-width: 210px;
      }

      .table-emoji {
        font-size: 1.5rem;
      }

      .table-desc {
        font-size: 0.8rem;
        color: var(--text-muted);
        max-width: 340px;
      }

      .nowrap {
        white-space: nowrap;
      }

      .muted-text {
        color: var(--text-muted);
        font-size: 0.82rem;
      }

      .table-actions {
        display: flex;
        gap: 6px;
      }

      .btn-sm {
        padding: 5px 10px;
        border-radius: 7px;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid var(--border-sand);
      }

      .btn-edit {
        background: var(--bg-warm-tint);
        color: var(--text-espresso);
      }

      .btn-delete {
        background: #fdf2f1;
        color: var(--danger);
        border-color: #ebc8c4;
      }

      .table-empty {
        text-align: center !important;
        padding: 28px !important;
        color: var(--text-muted);
      }

      .footer {
        border-top: 1px solid var(--border-sand);
        background: var(--bg-warm-tint);
        padding: 22px 0;
        font-size: 0.86rem;
      }

      .footer-inner {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .footer-note {
        margin: 0;
        color: var(--text-muted);
        font-size: 0.82rem;
      }

      @media (min-width: 640px) {
        .controls-bar {
          grid-template-columns: 1fr 220px;
        }

        .product-grid {
          grid-template-columns: repeat(2, 1fr);
        }

        .stats-grid {
          grid-template-columns: repeat(3, 1fr);
        }

        .form-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (min-width: 960px) {
        .hero-grid {
          grid-template-columns: 1.35fr 0.85fr;
        }

        .hero h1 {
          font-size: 2.5rem;
        }

        .product-grid {
          grid-template-columns: repeat(4, 1fr);
        }

        .footer-inner {
          flex-direction: row;
          justify-content: space-between;
          align-items: center;
        }
      }
    </style>
  </head>

            '10 sachet kopi drip praktis tinggal seduh berisi varian Arabika nusantara pilihan, cocok menemani kerja di kantor maupun perjalanan.',
          imageUrl: '🎁',
          unggulan: false,
        },
      ];

      function formatRupiah(amount) {
        const num = Number(amount);
        if (!Number.isFinite(num) || num < 0) return 'Rp 0';
        return 'Rp ' + Math.round(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function validateProduct(input) {
        const errors = [];
        if (!input || typeof input !== 'object') {
          return { valid: false, errors: ['Data produk tidak valid.'] };
        }

        const nama = typeof input.nama === 'string' ? input.nama.trim() : '';
        if (!nama) errors.push('Nama produk wajib diisi.');
        else if (nama.length > 100) errors.push('Nama produk maksimal 100 karakter.');

        const kategori = typeof input.kategori === 'string' ? input.kategori.trim() : '';
        if (!VALID_CATEGORIES.includes(kategori)) {
          errors.push('Kategori harus salah satu dari: ' + VALID_CATEGORIES.join(', ') + '.');
        }

        const harga = Number(input.harga);
        if (input.harga === '' || input.harga === null || typeof input.harga === 'boolean' || !Number.isFinite(harga) || harga < 0) {
          errors.push('Harga harus berupa angka >= 0.');
        }

        const stok = Number(input.stok);
        if (input.stok === '' || input.stok === null || typeof input.stok === 'boolean' || !Number.isFinite(stok) || !Number.isInteger(stok) || stok < 0) {
          errors.push('Stok harus berupa bilangan bulat >= 0.');
        }

        const deskripsi = typeof input.deskripsi === 'string' ? input.deskripsi.trim() : '';
        if (deskripsi.length > 500) errors.push('Deskripsi maksimal 500 karakter.');

        let imageUrl = typeof input.imageUrl === 'string' ? input.imageUrl.trim() : '☕';
        if (!imageUrl) imageUrl = '☕';
        const lowerImg = imageUrl.toLowerCase();
        if (lowerImg.startsWith('javascript:') || lowerImg.startsWith('data:') || lowerImg.startsWith('vbscript:')) {
          errors.push('Ikon/URL gambar tidak diizinkan.');
        }

        if (errors.length > 0) return { valid: false, errors };

        const id =
          typeof input.id === 'string' && input.id.trim()
            ? input.id.trim()
            : 'kopi-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);

        return {
          valid: true,
          errors: [],
          data: {
            id,
            nama,
            kategori,
            harga: Math.round(harga),
            stok,
            deskripsi,
            imageUrl,
            unggulan: Boolean(input.unggulan),
          },
        };
      }

      function filterProducts(products, { query = '', kategori = 'Semua', sort = 'default' } = {}) {
        if (!Array.isArray(products)) return [];
        const normalizedQuery = String(query ?? '').trim().toLowerCase();

        const filtered = products.filter((item) => {
          const matchCategory = !kategori || kategori === 'Semua' || item.kategori === kategori;
          if (!matchCategory) return false;
          if (!normalizedQuery) return true;
          const nama = String(item.nama ?? '').toLowerCase();
          const deskripsi = String(item.deskripsi ?? '').toLowerCase();
          return nama.includes(normalizedQuery) || deskripsi.includes(normalizedQuery);
        });

        const sorted = [...filtered];
        if (sort === 'termurah') sorted.sort((a, b) => a.harga - b.harga);
        else if (sort === 'termahal') sorted.sort((a, b) => b.harga - a.harga);
        else if (sort === 'nama-asc') sorted.sort((a, b) => a.nama.localeCompare(b.nama, 'id'));
        else sorted.sort((a, b) => Number(Boolean(b.unggulan)) - Number(Boolean(a.unggulan)));

        return sorted;
      }

      function buildWhatsAppUrl(nomor, produk) {
        if (!produk || typeof produk !== 'object') return null;
        const stok = Number(produk.stok);
        if (!Number.isFinite(stok) || stok <= 0) return null;

        const cleanPhone = String(nomor ?? '').replace(/[\s\-()+]/g, '');
        if (!/^[1-9]\d{7,14}$/.test(cleanPhone)) return null;

        const nama = String(produk.nama ?? '').trim();
        if (!nama) return null;

        const pesan =
          'Halo Toko Kopi Rejeki, saya ingin memesan ' +
          nama +
          ' (Harga: ' +
          formatRupiah(produk.harga) +
          '). Apakah stok masih tersedia?';
        return 'https://wa.me/' + cleanPhone + '?text=' + encodeURIComponent(pesan);
      }

      function parseProductsJSON(jsonString) {
        if (typeof jsonString !== 'string' || !jsonString.trim()) {
          return { ok: false, error: 'File atau teks JSON kosong.', products: null };
        }
        let parsed;
        try {
          parsed = JSON.parse(jsonString);
        } catch {
          return { ok: false, error: 'Format JSON tidak valid (gagal parsing).', products: null };
        }
        if (!Array.isArray(parsed) || parsed.length === 0) {
          return { ok: false, error: 'JSON harus berupa array produk yang tidak kosong.', products: null };
        }

        const validatedProducts = [];
        const seenIds = new Set();
        for (let i = 0; i < parsed.length; i += 1) {
          const check = validateProduct(parsed[i]);
          if (!check.valid) {
            return { ok: false, error: 'Produk ke-' + (i + 1) + ' tidak valid: ' + check.errors[0], products: null };
          }
          let uniqueId = check.data.id;
          if (seenIds.has(uniqueId)) uniqueId = uniqueId + '-' + (i + 1);
          seenIds.add(uniqueId);
          validatedProducts.push({ ...check.data, id: uniqueId });
        }
        return { ok: true, error: null, products: validatedProducts };
      }

      function loadProducts() {
        const defaultClone = INITIAL_PRODUCTS.map((p) => ({ ...p }));
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            window.localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultClone));
            return { products: defaultClone, corrupted: false, message: '' };
          }
          const parsed = parseProductsJSON(raw);
          if (!parsed.ok) {
            window.localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultClone));
            return {
              products: defaultClone,
              corrupted: true,
              message: 'Data localStorage rusak (' + parsed.error + '). Data demo bawaan telah dipulihkan.',
            };
          }
          return { products: parsed.products, corrupted: false, message: '' };
        } catch {
          return { products: defaultClone, corrupted: false, message: '' };
        }
      }

      function saveProducts(products) {
        try {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(products));

      }

          state.activeTab = 'katalog';
          update();
          return;
        }

        const action = target.dataset.action;
        if (action === 'switch-tab') {
          state.activeTab = target.dataset.tab === 'dashboard' ? 'dashboard' : 'katalog';
          state.formErrors = [];
          update();
        } else if (action === 'filter-category') {
          state.filters.kategori = target.dataset.category || 'Semua';
          update();
        } else if (action === 'reset-filters') {
          state.filters = { query: '', kategori: 'Semua', sort: 'default' };
          update();
        } else if (action === 'dismiss-toast') {
          state.toast = null;
          update();
        } else if (action === 'open-create') {
          state.isFormOpen = true;
          state.editingProduct = null;
          state.formErrors = [];
          update();
        } else if (action === 'close-form') {
          state.isFormOpen = false;
          state.editingProduct = null;
          state.formErrors = [];
          update();
        } else if (action === 'edit-product') {
          const found = state.products.find((p) => p.id === target.dataset.id);
          if (found) {
            state.isFormOpen = true;
            state.editingProduct = { ...found };
            state.formErrors = [];
            update();
            document.getElementById('product-form-panel')?.scrollIntoView({ behavior: 'smooth' });
          }
        } else if (action === 'delete-product') {
          const found = state.products.find((p) => p.id === target.dataset.id);
          if (!found) return;
          if (!window.confirm('Hapus produk "' + found.nama + '" dari katalog?')) return;
          state.products = state.products.filter((p) => p.id !== found.id);
          saveProducts(state.products);
          if (state.editingProduct && state.editingProduct.id === found.id) {
            state.isFormOpen = false;
            state.editingProduct = null;
          }
          showToast('Produk "' + found.nama + '" berhasil dihapus.', 'success');
          update();
        } else if (action === 'export-json') {
          const blob = new Blob([JSON.stringify(state.products, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'toko-kopi-rejeki-' + new Date().toISOString().slice(0, 10) + '.json';
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          showToast('Data produk berhasil di-export ke JSON.', 'success');
          update();
        } else if (action === 'reset-demo') {
          if (!window.confirm('Kembalikan katalog ke 8 produk demo awal Toko Kopi Rejeki?')) return;
          state.products = INITIAL_PRODUCTS.map((p) => ({ ...p }));
          saveProducts(state.products);
          state.isFormOpen = false;
          state.editingProduct = null;
          state.formErrors = [];
          showToast('Data demo Toko Kopi Rejeki berhasil dipulihkan.', 'success');
          update();
        }
      });

      appContainer.addEventListener('input', (event) => {
        if (event.target.dataset.input === 'query') {
          state.filters.query = event.target.value;
          update();
        }
      });

      appContainer.addEventListener('change', (event) => {
        const target = event.target;
        if (target.dataset.change === 'sort') {
          state.filters.sort = target.value;
          update();
          return;
        }
        if (target.dataset.change === 'import-json') {
          const file = target.files && target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            const result = parseProductsJSON(String(reader.result || ''));
            if (!result.ok) {
              showToast('Impor ditolak: ' + result.error, 'error');
              update();
              return;
            }
            state.products = result.products;
            saveProducts(state.products);
            state.isFormOpen = false;
            state.editingProduct = null;
            showToast('Berhasil mengimpor ' + result.products.length + ' produk.', 'success');
            update();
          };
          reader.readAsText(file);
          target.value = '';
        }
      });

      appContainer.addEventListener('submit', (event) => {
        if (event.target.id !== 'product-form') return;
        event.preventDefault();

        const formData = new FormData(event.target);
        const result = validateProduct({
          id: formData.get('id') || undefined,
          nama: formData.get('nama'),
          kategori: formData.get('kategori'),
          harga: formData.get('harga'),
          stok: formData.get('stok'),
          deskripsi: formData.get('deskripsi'),
          imageUrl: formData.get('imageUrl') || '☕',
          unggulan: formData.get('unggulan') === 'on',
        });

        if (!result.valid) {
          state.formErrors = result.errors;
          update();
          return;
        }

        if (state.editingProduct) {
          state.products = state.products.map((p) =>
            p.id === state.editingProduct.id ? { ...result.data, id: state.editingProduct.id } : p
          );
          showToast('Produk "' + result.data.nama + '" berhasil diperbarui.', 'success');
        } else {
          state.products = [result.data, ...state.products];
          showToast('Produk "' + result.data.nama + '" ditambahkan ke katalog.', 'success');
        }

        saveProducts(state.products);
        state.isFormOpen = false;
        state.editingProduct = null;
        state.formErrors = [];
        update();
      });

      update();
    </script>
  </body>
</html>
